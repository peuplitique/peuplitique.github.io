    <h2>Définition</h2>
    <p>
        L’économie intégrée vise à relier les secteurs, les ressources, les responsabilités 
        et les décisions dans un système cohérent, transparent et équilibré.
    </p>

    <h2>Objectifs</h2>
    <ul>
        <li>Réduire les ruptures entre secteurs</li>
        <li>Assurer une répartition équitable des ressources</li>
        <li>Créer une cohérence entre production, distribution et besoins</li>
        <li>Renforcer la résilience collective</li>
    </ul>

    <h2>Principes</h2>
    <p>

        citoyenne et la gestion collective des ressources essentielles.

<section class="content-section">
    <h2>Définition</h2>
    <p>
        Les déséquilibres structurels sont les ruptures profondes qui empêchent un système social,
        économique ou politique de fonctionner de manière cohérente. Ils apparaissent lorsque les
        responsabilités, les ressources ou les décisions sont mal réparties.
    </p>
</section>

<section class="content-section">
    <h2>Origines des déséquilibres</h2>
    <ul>
        <li>Concentration excessive du pouvoir</li>
        <li>Absence de transparence</li>
        <li>Rupture entre besoins réels et décisions</li>
        <li>Inégalités structurelles persistantes</li>
        <li>Manque de coordination entre secteurs</li>
    </ul>
</section>

<section class="content-section">
    <h2>Conséquences</h2>
    <ul>
        <li>Perte de confiance citoyenne</li>
        <li>Décisions inefficaces ou injustes</li>
        <li>Fragilité du système global</li>
        <li>Incapacité à anticiper les crises</li>
    </ul>
</section>

<section class="content-section">
    <h2>Correction des déséquilibres</h2>
    <p>
        La correction passe par la transparence, la redistribution des responsabilités,
        la participation citoyenne et une coordination renforcée entre les secteurs.
    </p>
